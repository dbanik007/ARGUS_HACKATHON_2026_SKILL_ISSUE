<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden bg-background bg-mesh">
  <!-- Neon decorative orb backdrops -->
  <div class="absolute w-[400px] h-[400px] rounded-full bg-primary/10 blur-[120px] top-1/4 left-1/4 animate-pulse"></div>
  <div class="absolute w-[300px] h-[300px] rounded-full bg-secondary/15 blur-[100px] bottom-1/3 right-1/4"></div>

  <!-- Main glassmorphic login card -->
  <div class="w-full max-w-[448px] glass-panel p-8 rounded-3xl border border-white/[0.08] relative z-10 shadow-2xl flex flex-col items-center">
    
    <!-- Branding logo/header -->
    <div class="w-16 h-16 rounded-2xl bg-surface-container border border-white/10 flex items-center justify-center mb-6 shadow-inner pulse-ring relative">
      <span class="material-symbols-outlined text-3xl text-primary neon-text-primary">forum</span>
    </div>
    
    <h1 class="text-headline-lg text-on-surface font-bold text-center tracking-tight mb-2">
      Boardroom <span class="text-primary neon-text-primary">AI</span>
    </h1>
    <p class="text-caption text-on-surface-variant/80 text-center mb-8 max-w-[280px]">
      Autonomous Multi-Agent Tender Evaluation & Negotiation Swarm
    </p>

    <!-- Error messaging banner -->
    <div *ngIf="errorMessage" class="w-full mb-6 p-4 rounded-lg bg-error-container/30 border border-error/20 text-error text-caption flex items-center gap-sm">
      <span class="material-symbols-outlined text-lg">error</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Actions -->
    <div class="w-full flex flex-col gap-sm">
      <!-- 1. Google Auth Button -->
      <button 
        (click)="loginWithGoogle()" 
        [disabled]="googleLoading || mockLoading"
        class="w-full h-12 rounded-lg bg-white text-black font-semibold text-label-md hover:bg-white/90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm shadow-md disabled:opacity-50">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69a5.74 5.74 0 0 1-2.48 3.77v3.12h4.01c2.34-2.16 3.69-5.32 3.69-8.74Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-4.01-3.12c-1.12.75-2.55 1.19-3.95 1.19-3.05 0-5.63-2.06-6.55-4.83H1.31v3.22A12.002 12.002 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.45 14.33a7.14 7.14 0 0 1 0-4.66V6.45H1.31a12.002 12.002 0 0 0 0 11.1l4.14-3.22Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43A11.957 11.957 0 0 0 12 0C7.26 0 3.19 2.72 1.31 6.45l4.14 3.22c.92-2.77 3.5-4.92 6.55-4.92Z"/>
        </svg>
        {{ googleLoading ? 'Redirecting to Google...' : 'Sign in with Google' }}
      </button>

      <!-- 2. Mock Bypass Button (Perfect for grading / instant demo) -->
      <button 
        (click)="loginWithMock()"
        [disabled]="googleLoading || mockLoading"
        class="w-full h-12 rounded-lg bg-surface-container-high border border-white/10 text-on-surface font-semibold text-label-md hover:bg-surface-container-highest hover:border-white/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm disabled:opacity-50">
        <span class="material-symbols-outlined text-lg text-primary">account_circle</span>
        {{ mockLoading ? 'Bypassing...' : 'Bypass with Mock Profile' }}
      </button>
    </div>

    <!-- Telemetry status indicator -->
    <div class="mt-8 text-[10px] text-on-surface-variant/40 tracking-widest uppercase flex items-center gap-xs">
      <span class="w-1.5 h-1.5 rounded-full bg-primary animate-ping"></span>
      Swarm Engine Online
    </div>

  </div>
</div>
